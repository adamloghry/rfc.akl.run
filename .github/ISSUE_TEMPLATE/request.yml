name: Request an explainer
description: Ask for a full explainer of an RFC that only has a short summary or none yet.
title: "Explainer request: RFC "
labels: ["explainer-request"]
body:
  - type: input
    id: rfc-number
    attributes:
      label: RFC number
      description: The number only, for example 2131.
      placeholder: "2131"
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What's confusing?
      description: Which part of the RFC or its current page is hard to follow? What would you like to understand?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Optional. What are you trying to do, or what do you already know?
    validations:
      required: false
