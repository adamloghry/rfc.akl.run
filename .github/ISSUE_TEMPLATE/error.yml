name: Report an error
description: Something on a page is wrong, misleading or broken.
title: "Error: "
labels: ["content-error"]
body:
  - type: input
    id: page-url
    attributes:
      label: Page URL
      placeholder: https://rfc.akl.run/903/
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong?
      description: Quote the text that is wrong and say what it should be, with a source if you have one.
    validations:
      required: true
