name: Ask a question
description: Ask a question about how an RFC or protocol works.
title: "Question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Ask it the way you would ask a person.
    validations:
      required: true
  - type: input
    id: rfc-number
    attributes:
      label: Related RFC number
      description: Optional. The RFC the question is about, if you know.
      placeholder: "903"
    validations:
      required: false
