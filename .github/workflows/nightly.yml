name: Nightly build and deploy
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --import tsx scripts/lint-content.ts
      - run: npx astro check
      - name: Fetch reader demand
        run: node --import tsx scripts/fetch-demand.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx astro build
      - run: node --import tsx scripts/check-dist.ts
      - name: Coverage diff vs deployed site
        run: |
          if curl -fsS --max-time 30 https://rfc.akl.run/data/coverage.json -o "$RUNNER_TEMP/old-coverage.json"; then
            :
          else
            echo "deployed coverage.json unavailable; skipping baseline"
            rm -f "$RUNNER_TEMP/old-coverage.json"
          fi
          node --import tsx scripts/coverage-diff.ts "$RUNNER_TEMP/old-coverage.json" dist/data/coverage.json
      # Deploy only from trunk (scheduled runs use the default branch; manual runs may pick another).
      - if: github.ref == 'refs/heads/trunk'
        run: npx --yes wrangler@4.151.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
