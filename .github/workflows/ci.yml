name: CI
on:
  pull_request:
  push:
    branches: [trunk]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/rfc-index.xml
          key: rfc-index-${{ steps.today.outputs.date }}
          restore-keys: rfc-index-
      - run: npm test
      - run: npm run lint
      - run: node scripts/build.js
      - run: node scripts/check-dist.js
