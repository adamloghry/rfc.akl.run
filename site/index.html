  <script>
    // Set theme before paint to avoid flash when OS prefers dark.
    (function () {
      try {
        var stored = localStorage.getItem('rfc-theme');
        var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <header class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="topbar-center">
      <div class="search-box" id="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search all RFCs... (Ctrl+K)" autocomplete="off">
        <kbd class="search-kbd">Ctrl+K</kbd>
      </div>
    </div>
    <div class="topbar-right">
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark mode">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a id="ietf-link" href="https://datatracker.ietf.org/doc/html/rfc903" target="_blank" rel="noopener" class="external-link" title="View on IETF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-inner" id="sidebar-inner">
      <!-- Populated dynamically by app.js -->
    </div>
  </nav>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="content" id="content">
    <!-- Rendered dynamically by app.js -->
  </main>

  <div class="search-overlay" id="search-overlay">
    <div class="search-results" id="search-results"></div>
  </div>

  <script src="data/rfcs-bundle.js"></script>
  <script src="app.js"></script>
