<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rfc.akl.run - RFC Viewer</title>
  <meta name="description" content="An interactive viewer for the Internet's most important RFCs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F4E1;</text></svg>">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <header class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="topbar-center">
      <div class="search-box" id="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search all RFCs... (Ctrl+K)" autocomplete="off">
        <kbd class="search-kbd">Ctrl+K</kbd>
      </div>
    </div>
    <div class="topbar-right">
      <a id="ietf-link" href="https://datatracker.ietf.org/doc/html/rfc903" target="_blank" rel="noopener" class="external-link" title="View on IETF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      </a>
    </div>
  </header>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-inner" id="sidebar-inner">
      <!-- Populated dynamically by app.js -->
    </div>
  </nav>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <main class="content" id="content">
    <!-- Rendered dynamically by app.js -->
  </main>

  <div class="search-overlay" id="search-overlay">
    <div class="search-results" id="search-results"></div>
  </div>

  <script src="data/rfcs-1.js"></script>
  <script src="data/rfcs-2.js"></script>
  <script src="data/rfcs-3.js"></script>
  <script src="data/rfcs-4.js"></script>
  <script src="app.js"></script>
</body>
</html>
